[package]
name = "endpoint-libs"
version = "2.1.4"
edition = "2024"
authors = ["Veon <dveonloch@protonmail.com>"]
description = "Launch MCP services fast: describe endpoints once in RON, and endpoint-gen generates the Rust models, docs and MCP tool schemas that this crate serves over WebSocket RPC, with roles and typed errors built in."
homepage = "https://github.com/pathscale/endpoint-libs"
documentation = "https://docs.rs/endpoint-libs"
keywords = ["websocket", "rpc", "mcp", "openapi", "codegen"]
categories = ["web-programming::websocket", "network-programming", "development-tools"]
repository = "https://github.com/pathscale/endpoint-libs"
readme = "README.md"
license = "MIT"

[features]
default = ["types"]
full = [
    "types",
    "ws",
    "database",
    "signal",
    "scheduler",
    "log_reader",
    "error_aggregation",
    "log_throttling",
    "ws-http1",
    "ws-tls12",
]
types = [
    "dep:serde",
    "dep:serde_json",
    "dep:derive_more",
    "dep:convert_case",
    "dep:itertools",
    "dep:clap",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:chrono",
    "dep:urlencoding",
    "dep:hex",
    "dep:rust_decimal",
    "dep:tracing-appender",
    "dep:serde_path_to_error",
    "dep:alloy-primitives",
    "dep:hyper-rustls",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry-appender-tracing",
    "dep:tonic",
]
wire-core = ["dep:async-trait", "dep:serde", "dep:serde_json"]
ws-core = [
    # Shared WS infrastructure (WsMessage, server, session, traits, etc.)
    "wire-core",
    "types",
    "signal",
    "dep:parking_lot",
    "dep:dashmap",
    "dep:async-trait",
    "dep:httpdate",
    "dep:crossfire",
]
framed-transport = [
    # Length-delimited WireMessage framing over any byte stream (Unix sockets,
    # named pipes, inherited socketpairs). No WebSocket, no TLS, no HTTP.
    "wire-core",
    "dep:tokio-util",
]
agent-control = ["framed-transport"]
ws-client = [
    # WS client (WsClient, WsClientBuilder) - standalone
    "ws-core",
    "dep:tokio-tungstenite",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:webpki-roots",
]
ws = [
    "ws-core",
    # Backend-specific deps (hyper + TLS + tokio-tungstenite)
    "dep:tokio-tungstenite",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:reqwest",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:webpki-roots",
    # "dep:",
]
database = [
    # Feature dependencies
    "dep:tokio-postgres",
    "dep:dashmap",
    "dep:secrecy",
    "dep:postgres-from-row",
    "dep:deadpool-postgres",
    # "dep:",
]
signal = [
    # Feature dependencies
    "dep:tokio-util",
    "dep:lazy_static",
    # "dep:",
]
scheduler = [
    # Feature dependencies
    "dep:tokio-cron-scheduler",
    # "dep:",
]
log_reader = [
    # Feature dependencies
    "dep:tempfile",
    "dep:regex",
    "dep:rev_lines",
    "dep:lazy_static",
    # "dep:",
]
error_aggregation = [
    # Feature dependencies
    "dep:regex",
    "dep:lazy_static",
    # "dep:",
]
log_throttling = ["dep:tracing-throttle"]
ws-http1 = ["ws", "hyper/http1"]
ws-tls12 = ["ws", "rustls/tls12", "tokio-rustls/tls12"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", features = ["raw_value"], optional = true }
eyre = "0.6"
derive_more = { version = "2.1.1", features = ["display"], optional = true }
convert_case = { version = "0.6", optional = true }
itertools = { version = "0.12", optional = true }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
futures = "0.3"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "std",
    "fmt",
], optional = true }
bytes = "1.7"
chrono = {version = "0.4.44", default-features = false, features = ["oldtime", "std", "now"], optional = true}
urlencoding = { version = "2.1", optional = true }
hex = { version = "0.4", optional = true }
rust_decimal = { version = "1.36", optional = true }
tracing-appender = { version = "0.2", optional = true }
serde_path_to_error = { version = "0.1", optional = true }
alloy-primitives = { version = "1.3.0", features = [
    "std",
], default-features = false, optional = true }

# Optional dependencies
tokio-tungstenite = { version = "0.29.0", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "connect",
], optional = true }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "logging"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "logging", "std"] }
tokio = { version = "1.39", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"], optional = true }
tokio-cron-scheduler = { version = "0.11", optional = true }
tokio-postgres = { version = "0.7", optional = true }
postgres-from-row = { version = "0.5", optional = true }
deadpool-postgres = { version = "0.14", features = ["serde"], optional = true }
parking_lot = { version = "0.12", optional = true }
dashmap = { version = "6.0", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "charset",
    "http2",
    "system-proxy",
], optional = true }
secrecy = { version = "0.8", features = ["serde"], optional = true }
tempfile = { version = "3.19", optional = true }
regex = { version = "1.5", optional = true }
rev_lines = { version = "0.3", optional = true }
lazy_static = { version = "1.5", optional = true }
async-trait = { version = "0.1", optional = true }
hyper = { version = "1", features = ["http2", "server", "client"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"], optional = true }
http-body-util = { version = "0.1", optional = true }
httpdate = { version = "1.0", optional = true }
tracing-throttle = { version = "0.4", features = ["async"], optional = true }
webpki-roots = { version = "1.0.7", optional = true }
crossfire = { version = "3.1", features = ["tokio"], optional = true }
# Force bundled CA roots for hyper-rustls (used by instant-acme inside cert-provider)
hyper-rustls = { version = "0.27.9", default-features = false, features = ["webpki-tokio"], optional = true }
# OpenTelemetry dependencies (default feature)
opentelemetry = { version = "0.31", features = ["logs"], optional = true }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "logs"], optional = true }
opentelemetry-otlp = { version = "0.31", features = ["trace", "logs", "http-proto"], optional = true }
opentelemetry-semantic-conventions = { version = "0.31", optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }
opentelemetry-appender-tracing = { version = "0.31", optional = true }
# Direct deps for header configuration
tonic = { version = "0.14", optional = true }

[dev-dependencies]
tempfile = "3.19"
tokio = { version = "1.39", features = ["full", "test-util"] }
tracing-throttle = { version = "0.4", features = ["async", "test-helpers"] }
uuid = { version = "1", features = ["v4", "serde"] }
rcgen = "0.14"

[[example]]
name = "uds_echo"
path = "examples/uds_echo.rs"
required-features = ["full", "framed-transport", "ws-client"]

[[example]]
name = "mcp_echo"
required-features = ["ws-http1"]

[[example]]
name = "ws_echo_rustls"
required-features = ["ws"]

[[example]]
name = "ws_echo_ws_client"
required-features = ["ws-client"]

[[example]]
name = "ws_echo_server"
path = "examples/ws-echo/main.rs"
required-features = ["ws"]

[package.metadata.cargo-all-features]

# Always include these features in combinations.
# These features should not be included in `skip_feature_sets` or `denylist`, they get
# added in later
always_include_features = ["types"]

# Exclude certain features from the build matrix
denylist = [
    "full",           # full is redundant to include in the matrix
    "log_throttling", # log_throttling is currently not working
]

# If your crate has a large number of optional dependencies, skip them for speed
# skip_optional_dependencies = true

# Add back certain optional dependencies that you want to include in the permutations
# extra_features = [
#     "log",
# ]

# The maximum number of features to try at once. Does not count features from `always_include_features`.
# This is useful for reducing the number of combinations run for a crate with a large amount of features,
# since in most cases a bug just needs a small set of 2-3 features to reproduce.
# With 11 matrix features the unbounded matrix is 2048 combinations (hours per CI
# job); capping at 3 gives 232 combinations while still covering every pairwise
# and most triple-feature interactions.
max_combination_size = 3

# Only include certain features in the build matrix
#(incompatible with `denylist`, `skip_optional_dependencies`, and `extra_features`)
# allowlist = ["foo", "bar"]

# Disable the entire package from being tested (useful in a workspace)
# skip_package = true
