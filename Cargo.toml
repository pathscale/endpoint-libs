[package]
name = "endpoint-libs"
version = "3.2.1"
edition = "2024"
authors = ["Veon <dveonloch@protonmail.com>"]
description = "Launch MCP services fast: describe endpoints once in RON, and endpoint-gen generates the Rust models, docs and MCP tool schemas that this crate serves over WebSocket RPC, with roles and typed errors built in."
homepage = "https://github.com/pathscale/endpoint-libs"
documentation = "https://docs.rs/endpoint-libs"
keywords = ["websocket", "rpc", "mcp", "openapi", "codegen"]
categories = ["web-programming::websocket", "network-programming", "development-tools"]
repository = "https://github.com/pathscale/endpoint-libs"
readme = "README.md"
license = "MIT"

[features]
default = ["types"]
full = [
    "types",
    "ws",
    "signal",
    "scheduler",
    "log_reader",
    "error_aggregation",
    "log_throttling",
    "ws-http1",
    "ws-tls12",
]
types = [
    "dep:serde",
    "dep:serde_json",
    "dep:derive_more",
    "dep:convert_case",
    "dep:itertools",
    "dep:clap",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:chrono",
    "dep:urlencoding",
    "dep:hex",
    "dep:tracing-appender",
    "dep:serde_path_to_error",
    "dep:alloy-primitives",
]
wire-core = ["dep:async-trait", "dep:serde", "dep:serde_json"]
ws-core = [
    # Shared WS infrastructure (WsMessage, server, session, traits, etc.)
    "wire-core",
    "types",
    "signal",
    "dep:parking_lot",
    "dep:dashmap",
    "dep:async-trait",
    # Named directly, not taken through `signal`. Every feature has to name the
    # dependencies its own code uses or it does not compile alone, and this is
    # the runtime now: `listener.rs` is `nagoya::reactor::TcpListener`,
    # `server.rs` resolves with `nagoya::reactor::resolve` and drives the
    # accept loop with `Reactor::local` and `block_on_with`, and `traits.rs`
    # bounds `RawStream` on `nagoya::io::Stream`.
    "dep:nagoya",
]
framed-transport = [
    # Length-delimited WireMessage framing over any byte stream (Unix sockets,
    # named pipes, inherited socketpairs). No WebSocket, no TLS, no HTTP.
    #
    # This is the neutral half: `framed_json_neutral` over `futures_io`. It names
    # no runtime, so a consumer that takes only this never sees tokio, because
    # there is no longer a tokio anything to see. This is the only framing
    # path now.
    "wire-core",
]
nagoya-transport = [
    # `framed_json_neutral` over a Nagoya socket. Off by default and additive: a
    # consumer that does not run Nagoya never compiles it.
    "framed-transport",
    "dep:nagoya",
]
# `framed-transport-tokio` is gone, and with it the only reason this named a
# runtime. The neutral path put identical bytes on the wire, so what the tokio
# flavour offered was an adapter type and a dependency. A consumer holding a
# tokio `AsyncRead + AsyncWrite` bridges it on their own side.
agent-control = ["framed-transport"]
ws-client = [
    # WS client (WsClient, WsClientBuilder). The handshake and the framing are
    # nago-wss over a nagoya socket; there is no hyper and no tungstenite here
    # any more, and therefore no tokio. A client socket is bound to one reactor,
    # so the constructors take a `&Handle`.
    "ws-core",
    "dep:nago-wss",
]
# Client-side TLS, off by default and deliberately not implied by `ws-client`.
# TLS is what drags `std` in, and the fleet's internal services are moving to
# plain `ws://` behind a proxy that terminates it, so the common build should
# not compile rustls at all. A `wss://` URL is refused with a message naming
# this feature when it is off.
ws-client-tls = ["ws-client", "nago-wss/tls", "nago-wss/webpki-roots"]
ws = [
    # The serving half. nago-wss performs the RFC 6455 upgrade over a nagoya
    # socket; hyper, tokio-tungstenite and tokio-rustls are all gone with the
    # HTTP/2 path and the TLS listener.
    #
    # There is no server TLS. Termination is the proxy's (fly.io terminates and
    # forwards plain to the app's internal port), which is what lets this half
    # stay free of `std`-bound crypto. That also removes ALPN, and with it the
    # only way h2 was ever negotiated, so RFC 8441 extended CONNECT is gone
    # rather than merely unused.
    #
    # `reqwest` and `hyper-rustls` are not named either. Neither was ever called
    # by a line of code in this crate: they were a feature-unification pin for
    # bundled CA roots, and a consumer that wants that pin states it itself.
    "ws-core",
    "dep:nago-wss",
]
signal = [
    # The shutdown flag is `nagoya::sync::Notify` plus an `AtomicBool`, and
    # delivery is `nagoya::signal::Signal`. The dependency line enables
    # nagoya's `reactor` feature, so this feature pulls the reactor along with
    # `sync`, which is what `Signal` registers on. A `Signal` is bound to one
    # reactor and only fires while that reactor is polled, so `init_signals`
    # takes the `Handle`.
    "dep:nagoya",
    # `signal.rs` waits with `futures::future::select`, so this feature names
    # no select macro.
    # `signal.rs` logs the signal it caught. `types` happens to pull tracing in,
    # so this was never missed until somebody enabled `signal` on its own.
    "dep:tracing",
]
scheduler = [
    # `tokio-cron-scheduler` is gone with the runtime: it was an entire
    # tokio-native crate and a 500ms tick wheel behind an interface this crate
    # drives itself. The ticks are `nagoya::sleep` and
    # `nagoya::runtime::background().spawn`.
    "dep:nagoya",
]
log_reader = [
    "dep:tempfile",
    "dep:regex",
    "dep:rev_lines",
    # The read is blocking and nagoya has no `spawn_blocking`, so it goes to a
    # `std::thread` and comes back over a `futures` oneshot. nagoya is named
    # for `block_on` in the tests.
    "dep:nagoya",
    "dep:lazy_static",
    # `log_reader.rs` parses a tracing level and an RFC 3339 timestamp out of
    # each line, so it names both crates directly. Same reason as `signal`:
    # `types` supplied them in every set anyone built.
    "dep:tracing",
    "dep:chrono",
]
error_aggregation = [
    # `nagoya::sync::RwLock` for the storage, a `futures` unbounded channel for
    # the entries, and `nagoya::runtime::background()` for the aggregation
    # task. The channel is `futures` rather than `ws::outbound` because this
    # one is unbounded and that one is a bounded single-consumer queue.
    "dep:nagoya",
    "dep:regex",
    "dep:lazy_static",
]
log_throttling = [
    "dep:tracing-throttle",
    # The metrics reporter in `log.rs` is a spawned loop:
    # `nagoya::runtime::background().spawn` plus `nagoya::sleep`.
    "dep:nagoya",
]
# HTTP/1.1 is the only thing served now, so this is what `ws` already is.
# Kept as a no-op alias rather than removed: every backend in the fleet names
# it, and a feature that vanishes is a build error in eight repositories for
# no gain. It named `hyper/http1` when there was an HTTP/2 arm to choose
# against.
ws-http1 = ["ws"]
# TLS 1.2 alongside 1.3, back when this crate terminated TLS itself. It does
# not any more: termination is the proxy's. Kept as a no-op alias for the same
# reason as `ws-http1`, and it now selects nothing because there is no rustls
# in this graph to select it on.
ws-tls12 = ["ws"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", features = ["raw_value"], optional = true }
eyre = "0.6"
derive_more = { version = "2.1.1", features = ["display"], optional = true }
convert_case = { version = "0.6", optional = true }
itertools = { version = "0.12", optional = true }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
futures = "0.3"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "std",
    "fmt",
], optional = true }
bytes = "1.7"
chrono = {version = "0.4.44", default-features = false, features = ["oldtime", "std", "now"], optional = true}
urlencoding = { version = "2.1", optional = true }
hex = { version = "0.4", optional = true }
tracing-appender = { version = "0.2", optional = true }
serde_path_to_error = { version = "0.1", optional = true }
alloy-primitives = { version = "1.3.0", features = [
    "std",
], default-features = false, optional = true }

# The I/O driver is behind Nagoya's own non-default `reactor` feature; without it
# `nagoya::reactor` does not exist and the error reads like a missing module.
# 0.1.11 is the release that carries `signal::Signal`, `resolve` and
# `connect_any`, which is what the tokio removal needed and what 0.1.9 did not
# have. A caret so the family moves on its own: 0.1.11 is the floor, not a pin.
nagoya = { version = "^0.1.11", default-features = false, features = ["reactor"], optional = true }
# The WebSocket protocol itself: the RFC 6455 handshake and framing over a
# nagoya socket, replacing hyper on the serving side and tokio-tungstenite on
# the connecting side. `default-features = false` is load bearing: the default
# set includes `tls` and `webpki-roots`, which is exactly the std-bound crypto
# this crate is trying not to compile. `ws-client-tls` turns them back on for
# a consumer that dials an external `wss://`.
#
# 0.3.0 is the release that can carry the kept HTTP extras: 0.2.0's
# `build_response` emitted a fixed 101 and its `parse_request` discarded every
# header but five, so `Origin` and a CORS policy were not expressible at all.
# A caret, so the family moves without touching this line.
nago-wss = { version = "^0.3", default-features = false, features = [
    "reactor",
    "simd-utf8",
], optional = true }
# House fork of parking_lot's Mutex and RwLock (`~/code/parking_lot_lite_hack`,
# published as `parking_lot_lite_hack`). `package` keeps `use parking_lot::...`.
# Registry, not a sibling path: this branch is the one that would carry a
# path to master. Call sites use `RwLock` and `Mutex` only, which the fork
# kept. `std` stays off. dashmap 6 links `parking_lot_core` itself, not this
# facade, so the two cores sit side by side.
parking_lot = { package = "parking_lot_lite_hack", version = "^0.12", default-features = false, optional = true }
dashmap = { version = "6.0", optional = true }
tempfile = { version = "3.19", optional = true }
regex = { version = "1.5", optional = true }
rev_lines = { version = "0.3", optional = true }
lazy_static = { version = "1.5", optional = true }
async-trait = { version = "0.1", optional = true }
# `async` is a default feature and it is the crate's only tokio edge
# (`async = ["tokio"]`). The one thing named here is `TracingRateLimitLayer`,
# which the synchronous half provides, so the default set is off and
# `human-readable` is asked for by name.
tracing-throttle = { version = "0.4", default-features = false, features = [
    "human-readable",
], optional = true }
# `tonic` used to be listed here for gRPC header configuration. The gRPC path and
# `OtelProtocol` were removed in 2.1.0 ("only using http"), the dependency was
# not, and it kept a tokio-bearing crate in the default graph. No module in this
# crate imports it.

[dev-dependencies]
tempfile = "3.19"
# `async` is this crate's only tokio edge (`async = ["tokio"]`), so the dev
# build asks for the same synchronous half the normal one does, plus the
# helpers the tests need.
tracing-throttle = { version = "0.4", default-features = false, features = [
    "human-readable",
    "test-helpers",
] }
uuid = { version = "1", features = ["v4", "serde"] }

[[example]]
name = "ws_echo_server"
path = "examples/ws-echo/main.rs"
required-features = ["ws"]

[package.metadata.cargo-all-features]

# Always include these features in combinations.
# These features should not be included in `skip_feature_sets` or `denylist`, they get
# added in later
always_include_features = ["types"]

# Exclude certain features from the build matrix
denylist = [
    "full",           # full is redundant to include in the matrix
    "log_throttling", # log_throttling is currently not working
]

# If your crate has a large number of optional dependencies, skip them for speed
# skip_optional_dependencies = true

# Add back certain optional dependencies that you want to include in the permutations
# extra_features = [
#     "log",
# ]

# The maximum number of features to try at once. Does not count features from `always_include_features`.
# This is useful for reducing the number of combinations run for a crate with a large amount of features,
# since in most cases a bug just needs a small set of 2-3 features to reproduce.
# With 11 matrix features the unbounded matrix is 2048 combinations (hours per CI
# job); capping at 3 gives 232 combinations while still covering every pairwise
# and most triple-feature interactions.
max_combination_size = 3

# Only include certain features in the build matrix
#(incompatible with `denylist`, `skip_optional_dependencies`, and `extra_features`)
# allowlist = ["foo", "bar"]

# Disable the entire package from being tested (useful in a workspace)
# skip_package = true
