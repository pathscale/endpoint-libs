[package]
name = "endpoint-libs"
version = "3.2.0"
edition = "2024"
authors = ["Veon <dveonloch@protonmail.com>"]
description = "Launch MCP services fast: describe endpoints once in RON, and endpoint-gen generates the Rust models, docs and MCP tool schemas that this crate serves over WebSocket RPC, with roles and typed errors built in."
homepage = "https://github.com/pathscale/endpoint-libs"
documentation = "https://docs.rs/endpoint-libs"
keywords = ["websocket", "rpc", "mcp", "openapi", "codegen"]
categories = ["web-programming::websocket", "network-programming", "development-tools"]
repository = "https://github.com/pathscale/endpoint-libs"
readme = "README.md"
license = "MIT"

[features]
default = ["types"]
full = [
    "types",
    "ws",
    "signal",
    "scheduler",
    "log_reader",
    "error_aggregation",
    "log_throttling",
    "otel",
    "ws-http1",
    "ws-tls12",
]
types = [
    "dep:serde",
    "dep:serde_json",
    "dep:derive_more",
    "dep:convert_case",
    "dep:itertools",
    "dep:clap",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:chrono",
    "dep:urlencoding",
    "dep:hex",
    "dep:tracing-appender",
    "dep:serde_path_to_error",
    "dep:alloy-primitives",
]
otel = [
    # OTLP export of traces and logs out of the `setup_logging` subscriber.
    # Off by default: the exporter stack is `opentelemetry-otlp` plus `tonic`,
    # `reqwest` and `hyper-rustls`, every one of which depends on tokio
    # unconditionally. Leaving it in `types` meant that every consumer of the
    # default feature set compiled a tokio runtime it never asked for, which is
    # what `ws-core` -> `types` was dragging into an otherwise tokio-free graph.
    #
    # `OtelConfig` stays in `types` so a config struct literal keeps compiling
    # without this feature; `OtelGuards` and the exporters do not.
    "types",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry-appender-tracing",
    # No module under `otel` names tokio directly; `opentelemetry_sdk`'s
    # `rt-tokio` batch exporter spawns onto a runtime, so `rt` is what it needs.
    "dep:tokio",
    "tokio/rt",
]
wire-core = ["dep:async-trait", "dep:serde", "dep:serde_json"]
ws-core = [
    # Shared WS infrastructure (WsMessage, server, session, traits, etc.)
    "wire-core",
    "types",
    "signal",
    "dep:parking_lot",
    "dep:dashmap",
    "dep:async-trait",
    "dep:httpdate",
    # `net`: `listener.rs` is `tokio::net::TcpListener`/`TcpStream` and
    #   `server.rs` calls `tokio::net::lookup_host`.
    # `rt`: the per-shard `tokio::runtime::Builder::new_current_thread`, the
    #   `LocalSet`, `tokio::spawn`, and `tokio::task_local!` for `TOOLBOX`.
    # `sync`: `tokio::sync::mpsc` in `conn.rs`, `session.rs` and `toolbox.rs`,
    #   all of it in public struct fields.
    # `time`: the date-cache `tokio::time::sleep` in `server.rs`.
    # `tokio::io::{AsyncRead, AsyncWrite}` (the `TransportStream` bound in
    # `traits.rs`) are unconditional in tokio and need no feature.
    # `tokio/signal` arrives through the `signal` feature, which `ws-core`
    # already requires. The selects in `session.rs`, `server.rs` and
    # `signal.rs` are `futures::future::select`, so `tokio/macros` is not
    # named here.
    "dep:tokio",
    "tokio/net",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
]
framed-transport = [
    # Length-delimited WireMessage framing over any byte stream (Unix sockets,
    # named pipes, inherited socketpairs). No WebSocket, no TLS, no HTTP.
    #
    # This is the neutral half: `framed_json_neutral` over `futures_io`. It names
    # no runtime, so a consumer that takes only this never sees tokio in its
    # normal graph. The tokio-io flavour is `framed-transport-tokio`.
    "wire-core",
]
framed-transport-tokio = [
    # `framed_json` over `tokio::io`, built on `tokio_util::codec::Framed`. Same
    # bytes on the wire as the neutral path; `encode`/`decode` are shared.
    "framed-transport",
    # `framed.rs` names only `tokio::io::{AsyncRead, AsyncWrite}`, which are
    # unconditional. `tokio_util`'s `codec` feature names `tokio/io-util` for
    # `Framed` itself, so nothing extra belongs here.
    "dep:tokio",
    "dep:tokio-util",
]
nagoya-transport = [
    # `framed_json_neutral` over a Nagoya socket. Off by default and additive: a
    # consumer that does not run Nagoya never compiles it, and the tokio path is
    # untouched either way.
    "framed-transport",
    "dep:nagoya",
]
agent-control = ["framed-transport-tokio"]
ws-client = [
    # WS client (WsClient, WsClientBuilder) - standalone
    "ws-core",
    "dep:tokio-tungstenite",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:webpki-roots",
]
ws = [
    "ws-core",
    # Backend-specific deps (hyper + TLS + tokio-tungstenite)
    "dep:tokio-tungstenite",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:reqwest",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:webpki-roots",
    # Pins hyper-rustls to bundled CA roots. It is not named by any code in this
    # crate: it enters the graph through `reqwest`, and through `instant-acme`
    # when a consumer runs cert-provider next to this crate. Feature unification
    # is what makes the pin bite, so it belongs on the feature that pulls the TLS
    # stack rather than on `types`, which has no TLS in it at all.
    "dep:hyper-rustls",
    # "dep:",
]
signal = [
    # Feature dependencies
    "dep:tokio-util",
    # `signal.rs` is `tokio::signal::unix`. The two waits are
    # `futures::future::select`, so this feature does not name `tokio/macros`.
    "dep:tokio",
    "tokio/signal",
    "dep:lazy_static",
    # `signal.rs` logs the signal it caught. `types` happens to pull tracing in,
    # so this was never missed until somebody enabled `signal` on its own.
    "dep:tracing",
    # "dep:",
]
scheduler = [
    # Feature dependencies
    "dep:tokio-cron-scheduler",
    # `scheduler.rs` calls `tokio::spawn`/`tokio::task::spawn` and
    # `tokio::time::sleep`.
    "dep:tokio",
    "tokio/rt",
    "tokio/time",
    # "dep:",
]
log_reader = [
    # Feature dependencies
    "dep:tempfile",
    "dep:regex",
    "dep:rev_lines",
    # `log_reader.rs` reads the file on `tokio::task::spawn_blocking`.
    "dep:tokio",
    "tokio/rt",
    "dep:lazy_static",
    # `log_reader.rs` parses a tracing level and an RFC 3339 timestamp out of
    # each line, so it names both crates directly. Same reason as `signal`:
    # `types` supplied them in every set anyone built.
    "dep:tracing",
    "dep:chrono",
    # "dep:",
]
error_aggregation = [
    # Feature dependencies
    # `error_aggregation.rs` holds a `tokio::sync::RwLock` and an mpsc pair, and
    # keeps the `tokio::spawn`ed aggregation task's `JoinHandle`.
    "dep:tokio",
    "tokio/rt",
    "tokio/sync",
    "dep:regex",
    "dep:lazy_static",
    # "dep:",
]
log_throttling = [
    "dep:tracing-throttle",
    # The metrics reporter in `log.rs` is a `tokio::spawn` loop. `types` used to
    # supply tokio for the OTel SDK, so this was never missed; it does not any
    # more. The loop is `tokio::spawn` plus `tokio::time::sleep`.
    "dep:tokio",
    "tokio/rt",
    "tokio/time",
]
ws-http1 = ["ws", "hyper/http1"]
ws-tls12 = ["ws", "rustls/tls12", "tokio-rustls/tls12"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", features = ["raw_value"], optional = true }
eyre = "0.6"
derive_more = { version = "2.1.1", features = ["display"], optional = true }
convert_case = { version = "0.6", optional = true }
itertools = { version = "0.12", optional = true }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
futures = "0.3"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "std",
    "fmt",
], optional = true }
bytes = "1.7"
chrono = {version = "0.4.44", default-features = false, features = ["oldtime", "std", "now"], optional = true}
urlencoding = { version = "2.1", optional = true }
hex = { version = "0.4", optional = true }
tracing-appender = { version = "0.2", optional = true }
serde_path_to_error = { version = "0.1", optional = true }
alloy-primitives = { version = "1.3.0", features = [
    "std",
], default-features = false, optional = true }

# Optional dependencies
tokio-tungstenite = { version = "0.29.0", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "connect",
], optional = true }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "logging"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "logging", "std"] }
# tokio is optional, and carries no features of its own. It used to be a
# non-optional `features = ["full"]` dependency, which meant no consumer could
# ever get a tokio-free graph no matter which features it selected: `cargo tree
# -e normal -i tokio` could not come back empty. Every crate feature whose own
# code calls tokio now names `dep:tokio` together with the tokio features that
# code actually uses, so the set is the union of what is enabled, not `full`.
#
# `full` was hiding: fs, io-std, process, rt-multi-thread and parking_lot. No
# module in this crate names `tokio::fs`, `tokio::process` or a multi-thread
# runtime builder (`server.rs` builds `new_current_thread` per shard).
# `io-util` is used only in `#[cfg(test)]` code, where the dev-dependency below
# still supplies it, and by `tokio-util`'s `codec` feature, which names
# `tokio/io-util` itself.
tokio = { version = "1.39", default-features = false, optional = true }
tokio-util = { version = "0.7", features = ["codec"], optional = true }
# The I/O driver is behind Nagoya's own non-default `reactor` feature; without it
# `nagoya::reactor` does not exist and the error reads like a missing module.
# 0.1.9 is the published release that already speaks AF_UNIX and carries `TaskSet`,
# so this resolves from the registry with no path dependency and no sibling checkout.
nagoya = { version = "0.1.9", default-features = false, features = ["reactor"], optional = true }
tokio-cron-scheduler = { version = "0.11", optional = true }
parking_lot = { version = "0.12", optional = true }
dashmap = { version = "6.0", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "charset",
    "http2",
    "system-proxy",
], optional = true }
tempfile = { version = "3.19", optional = true }
regex = { version = "1.5", optional = true }
rev_lines = { version = "0.3", optional = true }
lazy_static = { version = "1.5", optional = true }
async-trait = { version = "0.1", optional = true }
hyper = { version = "1", features = ["http2", "server", "client"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"], optional = true }
http-body-util = { version = "0.1", optional = true }
httpdate = { version = "1.0", optional = true }
tracing-throttle = { version = "0.4", features = ["async"], optional = true }
webpki-roots = { version = "1.0.7", optional = true }
# Force bundled CA roots for hyper-rustls (used by instant-acme inside
# cert-provider, and by reqwest). Enabled by `ws`, not by `types`.
hyper-rustls = { version = "0.27.9", default-features = false, features = ["webpki-tokio"], optional = true }
# OpenTelemetry dependencies (behind the non-default `otel` feature)
opentelemetry = { version = "0.31", features = ["logs"], optional = true }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "logs"], optional = true }
# Default features are still on, so `grpc-tonic` comes along and drags `tonic`,
# `reqwest` and `hyper-rustls` in even though only `.with_http()` is ever called.
# That is why this whole block sits behind `otel`. Turning default features off
# needs an explicit HTTP client feature chosen and compiled, which is its own
# change.
opentelemetry-otlp = { version = "0.31", features = ["trace", "logs", "http-proto"], optional = true }
opentelemetry-semantic-conventions = { version = "0.31", optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }
opentelemetry-appender-tracing = { version = "0.31", optional = true }
# `tonic` used to be listed here for gRPC header configuration. The gRPC path and
# `OtelProtocol` were removed in 2.1.0 ("only using http"), the dependency was
# not, and it kept a tokio-bearing crate in the default graph. No module in this
# crate imports it.

[dev-dependencies]
tempfile = "3.19"
tokio = { version = "1.39", features = ["full", "test-util"] }
# `compat` only, and only for tests: it adapts a tokio duplex into the
# `futures-io` pair the neutral transport takes, which is what lets one test
# drive both framing paths and compare the bytes they produce.
tokio-util = { version = "0.7", features = ["codec", "compat"] }
tracing-throttle = { version = "0.4", features = ["async", "test-helpers"] }
uuid = { version = "1", features = ["v4", "serde"] }
rcgen = "0.14"

[[example]]
name = "uds_echo"
path = "examples/uds_echo.rs"
required-features = ["full", "framed-transport-tokio", "ws-client"]

[[example]]
name = "mcp_echo"
required-features = ["ws-http1"]

[[example]]
name = "ws_echo_rustls"
required-features = ["ws"]

[[example]]
name = "ws_echo_ws_client"
required-features = ["ws-client"]

[[example]]
name = "ws_echo_server"
path = "examples/ws-echo/main.rs"
required-features = ["ws"]

[package.metadata.cargo-all-features]

# Always include these features in combinations.
# These features should not be included in `skip_feature_sets` or `denylist`, they get
# added in later
always_include_features = ["types"]

# Exclude certain features from the build matrix
denylist = [
    "full",           # full is redundant to include in the matrix
    "log_throttling", # log_throttling is currently not working
]

# If your crate has a large number of optional dependencies, skip them for speed
# skip_optional_dependencies = true

# Add back certain optional dependencies that you want to include in the permutations
# extra_features = [
#     "log",
# ]

# The maximum number of features to try at once. Does not count features from `always_include_features`.
# This is useful for reducing the number of combinations run for a crate with a large amount of features,
# since in most cases a bug just needs a small set of 2-3 features to reproduce.
# With 11 matrix features the unbounded matrix is 2048 combinations (hours per CI
# job); capping at 3 gives 232 combinations while still covering every pairwise
# and most triple-feature interactions.
max_combination_size = 3

# Only include certain features in the build matrix
#(incompatible with `denylist`, `skip_optional_dependencies`, and `extra_features`)
# allowlist = ["foo", "bar"]

# Disable the entire package from being tested (useful in a workspace)
# skip_package = true
