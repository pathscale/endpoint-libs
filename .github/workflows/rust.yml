name: Rust

# No pull request trigger: the gate is the one an author runs locally before
# asking for review, and a tick that arrives unasked is a tick people stop
# reading. Master is different. The publish job below is gated on
# `github.event_name == 'push'` and reads `github.event.before` to diff
# Cargo.toml, so a push to master is the release mechanism and removing it
# silently stops releases rather than making anything manual.
on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubicloud-standard-8
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        cache-on-failure: "true"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: stable

    - name: Test supported feature boundaries
      run: |
        cargo test --no-default-features
        cargo test
        cargo test --no-default-features --features agent-control
        cargo test --no-default-features --features ws-client
        cargo test --no-default-features --features ws
        cargo test --no-default-features --features full
        cargo test --all-features


  clippy_check:

    runs-on: ubicloud-standard-8
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: "true"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy
      - name: Lint supported feature boundaries
        run: |
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --no-default-features --features agent-control -- -D warnings
          cargo clippy --all-targets --no-default-features --features ws-client -- -D warnings
          cargo clippy --all-targets --no-default-features --features ws -- -D warnings
          cargo clippy --all-targets --no-default-features --features full -- -D warnings
          cargo clippy --all-targets --all-features -- -D warnings

  format_check:

    runs-on: ubicloud-standard-8
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: "true"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt
            
      - name: Check formatting
        run: cargo fmt --all -- --check

  security_audit:
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      # audit-check reports its findings as a check run; without this the
      # report API call fails with "Resource not accessible by integration"
      # and the job errors even when no vulnerabilities are found.
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve current compatible dependencies for audit
        run: cargo generate-lockfile
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, clippy_check, format_check, security_audit]
    runs-on: ubicloud-standard-2
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Publish a reviewed version bump
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- Cargo.toml; then
            echo "Cargo.toml did not change; nothing to publish"
            exit 0
          fi
          cargo publish --registry crates-io
