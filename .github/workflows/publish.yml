name: Publish crate

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full commit SHA reviewed and locally checked before dispatch
        required: true
        type: string
      local_checks_attested:
        description: Confirm affected local checks and cargo publish --dry-run passed for this commit
        required: true
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'

permissions:
  contents: read

concurrency:
  group: cargo-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master' && inputs.local_checks_attested == 'yes'
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    environment: crates-io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Publish the manifest version to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          LOCAL_CHECKS_ATTESTED: ${{ inputs.local_checks_attested }}
        run: bash scripts/publish-crate.sh
